name: Build API v2 image

# Builds ONLY the API v2 image (no web app) and pushes it to GHCR so environments
# pull a pinned image instead of building the monorepo themselves (the build needs
# 8 GB of heap — see NODE_OPTIONS in apps/api/v2/Dockerfile).
#
# DATABASE_URL/DATABASE_DIRECT_URL are baked into the image as ENV by the Dockerfile,
# so they are passed as PLACEHOLDERS here — never real credentials. The runtime
# (Dokploy/ECS) overrides them.

on:
  push:
    tags:
      - "au-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_PAT (write:packages, package owner) — the package was created by a
          # user push, and GitHub's package settings cannot grant a FORK's GITHUB_TOKEN
          # access to it. Falls back to GITHUB_TOKEN if the secret is ever removed.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cal.diy-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/v2/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
            DATABASE_DIRECT_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
