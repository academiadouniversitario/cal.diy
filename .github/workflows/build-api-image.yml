name: Build API v2 image

# Builds ONLY the API v2 image (no web app) and pushes it to GHCR (dev, Dokploy) and —
# on `au-v*` tags — to the production ECR, so environments pull a pinned image instead
# of building the monorepo themselves (the build needs 8 GB of heap — see NODE_OPTIONS
# in apps/api/v2/Dockerfile).
#
# DATABASE_URL/DATABASE_DIRECT_URL are baked into the image as ENV by the Dockerfile,
# so they are passed as PLACEHOLDERS here — never real credentials. The runtime
# (Dokploy/ECS) overrides them.
#
# The image is linux/amd64 ONLY, which is why the prod ECS task definitions are X86_64
# and not ARM64 like the ATS API (see au-aws/infra/prod/cal-ecs.tf).

on:
  push:
    tags:
      - "au-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC → assume the AWS role (no long-lived keys)

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cal-api
  # Role created by OpenTofu (au-aws/infra/prod/cal-cicd-oidc.tf). Deterministic ARN.
  # Its trust policy accepts ONLY `repo:<this>:ref:refs/tags/au-v*`, so a dispatch on a
  # BRANCH cannot assume it — which is why the AWS steps below are gated on the ref and
  # a branch run still publishes to GHCR instead of failing.
  DEPLOY_ROLE_ARN: arn:aws:iam::986281581469:role/ats2-prod-cal-github-deploy

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_PAT (write:packages, package owner) — the package was created by a
          # user push, and GitHub's package settings cannot grant a FORK's GITHUB_TOKEN
          # access to it. Falls back to GITHUB_TOKEN if the secret is ever removed.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # continue-on-error so a credential/trust problem degrades to a GHCR-only publish
      # instead of losing the image entirely — the first au-v0.1.2 build died here and the
      # dev registry got nothing either.
      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/au-v')
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        if: startsWith(github.ref, 'refs/tags/au-v')
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v2

      # Assembled as a step output instead of inline in `images` so that a SKIPPED ECR
      # login contributes no line at all — a blank line there would become a bogus
      # image reference and fail the push.
      - id: targets
        run: |
          {
            echo 'images<<TARGETS'
            echo "ghcr.io/${{ github.repository_owner }}/cal.diy-api"
            if [ -n "${{ steps.ecr.outputs.registry }}" ]; then
              echo "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
            fi
            echo TARGETS
          } >> "$GITHUB_OUTPUT"

      # Version tag ONLY, no `latest`. The prod ECR is IMMUTABLE, so re-pushing a moving
      # tag fails the NEXT release with ImageTagAlreadyExistsException; metadata-action
      # cannot scope a tag to one of the images, and nothing consumes `latest` anyway
      # (dev pins CAL_IMAGE_TAG in the compose, prod pins cal_image_tag in tfvars).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false

      # One build, both registries: build-push-action pushes every tag metadata-action
      # rendered, so the ECR copy is byte-identical to the GHCR one (same digest).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/v2/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
            DATABASE_DIRECT_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
